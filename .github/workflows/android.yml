name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fonts/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Uses your own key if you add KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS as repo secrets.
      # Otherwise falls back to the public key in android/signing so updates keep the same signature.
      - name: Pick signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/signing/loomlogic-public.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=loomlogic-public" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=loomlogic" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LoomLogic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LoomLogic-apk
          path: LoomLogic.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" LoomLogic.apk \
            --title "Loom Logic $TAG" \
            --notes "Android build from commit ${GITHUB_SHA::7}. Download LoomLogic.apk on your phone and open it to install."
